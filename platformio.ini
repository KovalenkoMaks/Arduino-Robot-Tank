[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
build_src_flags = -Wall -Wextra
build_flags = -I${platformio.build_dir}/${this.__env__}/unity_config
lib_deps =
    z3t0/IRremote@^4.4.1
    arduino-libraries/Servo@^1.2.2

; Unit tests for lib/navigation, built and run on the host: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_ignore = drivers
